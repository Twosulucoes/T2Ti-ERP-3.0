# T2Ti ERP 3.0 - módulo Cadastros para o Coolify.
# O proxy do Coolify cuida do domínio e do HTTPS, então o serviço web não publica portas
# e o Caddy só atende HTTP na porta 80 interna. No Coolify, defina o domínio no serviço "web"
# e preencha as variáveis do .env.exemplo (menos DOMINIO) na aba Environment Variables.
name: t2ti-erp

services:
  mysql:
    build:
      context: ..
      dockerfile: deploy/cadastros/mysql.Dockerfile
    command:
      - --lower-case-table-names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina no .env}
      MYSQL_DATABASE: fenix
      MYSQL_USER: ${MYSQL_USER:-erp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina no .env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?defina no .env}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina no .env}
      TZ: America/Sao_Paulo
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/cadastros/backend.Dockerfile
    environment:
      DB_HOST: mysql
      DB_DATABASE: fenix
      DB_USERNAME: ${MYSQL_USER:-erp}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CHAVE_CRIPTOGRAFIA: ${CHAVE_CRIPTOGRAFIA:?defina no .env}
      VETOR_CRIPTOGRAFIA: ${VETOR_CRIPTOGRAFIA:?defina no .env}
      EXIGIR_TOKEN: "true"
      MOSTRAR_DETALHES_ERRO: "false"
      TZ: America/Sao_Paulo
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/cadastros/frontend.Dockerfile
      args:
        VITE_CHAVE_CRIPTOGRAFIA: ${CHAVE_CRIPTOGRAFIA}
        VITE_VETOR_CRIPTOGRAFIA: ${VETOR_CRIPTOGRAFIA}
    environment:
      DOMINIO: ":80"
    expose:
      - "80"
    volumes:
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-dados:
  caddy-dados:
  caddy-config:
