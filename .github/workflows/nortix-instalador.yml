name: Nortix - instalador Windows

# Compila o Nortix e o ACBrMonitor e junta os dois num instalador (Inno Setup).

on:
  workflow_dispatch:
  push:
    paths:
      - 'fontes/frontend/pegasus_pdv/**'
      - '.github/workflows/nortix-instalador.yml'
      - '.github/workflows/pegasus-pdv-windows.yml'
      - '.github/workflows/acbrmonitor-windows.yml'

jobs:
  pdv:
    uses: ./.github/workflows/pegasus-pdv-windows.yml

  acbr:
    uses: ./.github/workflows/acbrmonitor-windows.yml

  instalador:
    needs: [pdv, acbr]
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: fontes/frontend/pegasus_pdv/instalador
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Nortix-Windows
          path: fontes/frontend/pegasus_pdv/instalador/pdv

      - uses: actions/download-artifact@v4
        with:
          name: ACBrMonitor-Windows
          path: fontes/frontend/pegasus_pdv/instalador/acbr

      - name: Baixar o runtime do Visual C++
        run: Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe

      - name: Gerar o instalador
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          & $iscc nortix.iss
          if ($LASTEXITCODE -ne 0) { throw 'falha ao gerar o instalador' }
          Get-ChildItem saida

      - uses: actions/upload-artifact@v4
        with:
          name: Nortix-Instalador
          path: fontes/frontend/pegasus_pdv/instalador/saida/*.exe
