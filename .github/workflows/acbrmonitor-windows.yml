name: ACBrMonitorPLUS (Windows)

# Compila o ACBrMonitorPLUS a partir do código-fonte aberto do Projeto ACBr (LGPL),
# para o Pegasus PDV emitir NFC-e sem a assinatura do instalador pronto.

on:
  workflow_dispatch:
    inputs:
      revisao:
        description: 'Revisão do SVN do ACBr (HEAD para a mais recente)'
        default: 'HEAD'
  push:
    paths:
      - '.github/workflows/acbrmonitor-windows.yml'

env:
  ACBR_SVN: https://svn.code.sf.net/p/acbr/code/trunk2
  REVISAO: ${{ github.event.inputs.revisao || 'HEAD' }}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Instalar Lazarus e Subversion
        shell: pwsh
        run: |
          choco install lazarus sliksvn -y --no-progress
          $lazarus = (Get-ChildItem C:\lazarus\lazbuild.exe -ErrorAction SilentlyContinue)
          if (-not $lazarus) { $lazarus = Get-ChildItem 'C:\Program Files*\Lazarus*' -Recurse -Filter lazbuild.exe | Select-Object -First 1 }
          "LAZBUILD=$($lazarus.FullName)" | Out-File $env:GITHUB_ENV -Append
          "C:\Program Files\SlikSvn\bin" | Out-File $env:GITHUB_PATH -Append
          $fpc = Get-ChildItem (Split-Path $lazarus.FullName) -Recurse -Filter fpc.exe | Select-Object -First 1
          (Split-Path $fpc.FullName) | Out-File $env:GITHUB_PATH -Append
          & $lazarus.FullName --version

      - name: Baixar fontes do ACBr
        shell: pwsh
        run: |
          foreach ($pasta in 'Fontes', 'Pacotes/Lazarus', 'Projetos/ACBrMonitorPLUS/Lazarus', 'Projetos/ACBrLib/Fontes', 'DLLs/OpenSSL/3.1.3/x64', 'DLLs/LibXml2/x64') {
            svn export --quiet --force -r $env:REVISAO "$env:ACBR_SVN/$pasta" "acbr/$pasta"
            if ($LASTEXITCODE -ne 0) { throw "falha ao baixar $pasta" }
          }
          svn info -r $env:REVISAO $env:ACBR_SVN | Select-String 'Revision'
          git clone --depth 1 https://github.com/fortesinformatica/fortesreport-ce.git fortesreport
          # PowerPDF (usado pelo lazreportpdfexport) não vem mais junto com o Lazarus 4
          if (-not (Get-ChildItem C:\lazarus\components -Recurse -Filter pack_powerpdf.lpk)) {
            New-Item -ItemType Directory -Force terceiros | Out-Null
            $url = 'https://gitlab.com/freepascal.org/lazarus/lazarus/-/archive/lazarus_2_2_6/lazarus-lazarus_2_2_6.zip?path=components/powerpdf'
            try {
              $lista = Invoke-RestMethod https://packages.lazarus-ide.org/packagelist.json
              $item = $lista.PSObject.Properties.Value | Where-Object { $_.RepositoryFileName -match 'powerpdf' } | Select-Object -First 1
              if ($item) { $url = "https://packages.lazarus-ide.org/$($item.RepositoryFileName)" }
            } catch { }
            "PowerPDF: $url"
            Invoke-WebRequest $url -OutFile powerpdf.zip
            Expand-Archive powerpdf.zip terceiros/powerpdf
          }

      - name: Registrar pacotes
        shell: pwsh
        run: |
          $pacotes = Get-ChildItem acbr/Pacotes/Lazarus, fortesreport, terceiros -Recurse -Filter *.lpk -ErrorAction SilentlyContinue
          foreach ($pacote in $pacotes) {
            & $env:LAZBUILD --add-package-link $pacote.FullName | Out-Null
          }
          "$($pacotes.Count) pacotes registrados"

      - name: Compilar
        shell: pwsh
        working-directory: acbr/Projetos/ACBrMonitorPLUS/Lazarus
        run: |
          & $env:LAZBUILD --build-mode=Release-Win64-x86_64 --no-write-project ACBrMonitor.lpi
          if ($LASTEXITCODE -ne 0) { throw 'falha na compilação' }

      - name: Montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ACBrMonitor | Out-Null
          Copy-Item acbr/Projetos/ACBrMonitorPLUS/Lazarus/ACBrMonitor64.exe ACBrMonitor/ACBrMonitor.exe
          Copy-Item acbr/Projetos/ACBrMonitorPLUS/Lazarus/ACBrIBGE.txt, acbr/Projetos/ACBrMonitorPLUS/Lazarus/LICENSE.TXT ACBrMonitor/
          Copy-Item acbr/DLLs/OpenSSL/3.1.3/x64/* ACBrMonitor/ -Recurse
          Copy-Item acbr/DLLs/LibXml2/x64/* ACBrMonitor/ -Recurse
          # já liga a monitoração por ENT.TXT/SAI.TXT, que é como o Pegasus PDV conversa com o monitor
          "[ACBrMonitor]`r`nModo_TCP=0`r`nModo_TXT=1`r`nTXT_Entrada=ENT.TXT`r`nTXT_Saida=SAI.TXT`r`n" | Set-Content ACBrMonitor/ACBrMonitor.ini -Encoding ascii -NoNewline
          Get-ChildItem ACBrMonitor -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ACBrMonitor-Windows
          path: ACBrMonitor
