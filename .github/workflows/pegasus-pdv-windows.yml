name: Pegasus PDV (Windows)

# Chamado pelo nortix-instalador.yml; também pode ser rodado sozinho.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: fontes/frontend/pegasus_pdv
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: stable

      - name: Preparar projeto Windows
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.t2ti .
          flutter pub get

      - name: Aplicar a marca Nortix no executável
        shell: bash
        run: |
          cp assets/images/nortix.ico windows/runner/resources/app_icon.ico
          sed -i 's/set(BINARY_NAME "pegasus_pdv")/set(BINARY_NAME "Nortix")/' windows/CMakeLists.txt
          sed -i 's/window.Create(L"pegasus_pdv"/window.Create(L"Nortix"/' windows/runner/main.cpp
          sed -i -e 's/"CompanyName", "com.t2ti"/"CompanyName", "Nortix"/' -e 's/"FileDescription", "pegasus_pdv"/"FileDescription", "Nortix"/' -e 's/"ProductName", "pegasus_pdv"/"ProductName", "Nortix"/' -e 's/"InternalName", "pegasus_pdv"/"InternalName", "Nortix"/' -e 's/"OriginalFilename", "pegasus_pdv.exe"/"OriginalFilename", "Nortix.exe"/' windows/runner/Runner.rc
          grep -n 'BINARY_NAME "' windows/CMakeLists.txt
          grep -n 'window.Create' windows/runner/main.cpp
          grep -n 'Name"\|Description"\|Filename"' windows/runner/Runner.rc

      - name: Gerar .env cifrado
        shell: bash
        run: >
          dart run tool/gerar_env.dart
          SENTRY_DNS=DNS
          LINGUAGEM_SERVIDOR=php
          ENDERECO_SERVIDOR=https://erp.169.58.144.179.sslip.io
          PORTA_SERVIDOR=443
          COMPLEMENTO_ENDERECO_SERVIDOR=/api/pdv

      - name: Compilar
        run: flutter build windows --release

      - name: Montar pacote
        shell: pwsh
        run: |
          $origem = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $origem)) { $origem = 'build/windows/runner/Release' }
          Copy-Item sqlite3.dll $origem -Force
          New-Item -ItemType Directory -Force pacote | Out-Null
          Copy-Item "$origem/*" pacote -Recurse -Force
          if (-not (Test-Path pacote/data/flutter_assets/.env)) { throw 'o .env não entrou no pacote' }

      - uses: actions/upload-artifact@v4
        with:
          name: Nortix-Windows
          path: fontes/frontend/pegasus_pdv/pacote
          # o .env cifrado fica em data/flutter_assets/.env; sem isto o upload o descarta
          include-hidden-files: true
